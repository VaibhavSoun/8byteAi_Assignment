name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (git SHA from staging)"
        required: true
        type: string
      confirm:
        description: 'Type "deploy-to-production" to confirm'
        required: true
        type: string

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: 8byte-devops-app

jobs:
  # ─── Safety Gate: confirm intent ────────────────────────────────────────────
  validate-input:
    name: Validate Deployment Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation string
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-to-production" ]; then
            echo "❌ Confirmation string does not match. Aborting."
            exit 1
          fi
          echo "✅ Confirmation validated."

  # ─── Manual Approval Gate ───────────────────────────────────────────────────
  # GitHub Environment protection rules enforce manual approval here
  # Configure under: Settings → Environments → production → Required reviewers
  request-approval:
    name: Request Manual Approval
    runs-on: ubuntu-latest
    needs: validate-input
    environment: production   # ← This triggers the manual approval gate

    steps:
      - name: Log approval granted
        run: echo "✅ Production deployment approved by ${{ github.actor }}"

  # ─── Production Deploy ──────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: request-approval

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image as production-latest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:production-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:production-latest

      - name: Strict container scan before production
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"  # Block production deploy on CRITICAL CVEs

      - name: Deploy to production via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          INSTANCE_ID="${{ secrets.PROD_INSTANCE_ID }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(echo $IMAGE_URI | cut -d/ -f1)',
              'docker pull $IMAGE_URI',
              'docker stop app || true',
              'docker rm app || true',
              'SECRET_JSON=\$(aws secretsmanager get-secret-value --secret-id 8byte-devops/rds/credentials --region ${{ env.AWS_REGION }} --query SecretString --output text)',
              'DATABASE_URL=\$(echo \$SECRET_JSON | jq -r .url)',
              'docker run -d --name app --restart unless-stopped -p 8000:8000 -e DATABASE_URL=\$DATABASE_URL -e ENVIRONMENT=production -v /var/log/app:/app/logs $IMAGE_URI',
              'sleep 10',
              'curl -sf http://localhost:8000/health || exit 1'
            ]" \
            --output text \
            --query "Command.CommandId")

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status: Status, Output: StandardOutputContent}'

      - name: Production health check
        run: |
          sleep 15
          ALB_DNS="${{ secrets.ALB_DNS }}"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check $i passed"
            else
              echo "❌ Health check $i failed: $STATUS"
              exit 1
            fi
            sleep 5
          done

      - name: Notify Slack — production deployed
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 Production Deployed",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "🚀 *Production Deployed Successfully*\n*Image Tag:* `${{ github.event.inputs.image_tag }}`\n*Deployed by:* ${{ github.actor }}\n*Time:* <!date^$(date +%s)^{date_time}|now>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔥 PRODUCTION DEPLOY FAILED",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "🔥 *PRODUCTION DEPLOY FAILED*\n*Image Tag:* `${{ github.event.inputs.image_tag }}`\n*Attempted by:* ${{ github.actor }}\n*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
