name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (git SHA from staging)"
        required: true
        type: string
      confirm:
        description: 'Type "deploy-to-production" to confirm'
        required: true
        type: string

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: 8byte-devops-app

jobs:
  validate-input:
    name: Validate Deployment Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation string
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-to-production" ]; then
            echo "❌ Confirmation string does not match. Aborting."
            exit 1
          fi
          echo "✅ Confirmation validated."

  request-approval:
    name: Request Manual Approval
    runs-on: ubuntu-latest
    needs: validate-input
    environment: production
    steps:
      - name: Log approval granted
        run: echo "✅ Production deployment approved by ${{ github.actor }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: request-approval

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Strict container scan before production
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"

      - name: Deploy to production via SSM
        run: |
          INSTANCE_ID="${{ secrets.PROD_INSTANCE_ID }}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(echo $IMAGE_URI | cut -d/ -f1)',
              'docker pull $IMAGE_URI',
              'docker stop app || true',
              'docker rm app || true',
              'docker run -d --name app --restart unless-stopped -p 8000:8000 -e ENVIRONMENT=production $IMAGE_URI',
              'sleep 10',
              'curl -sf http://localhost:8000/health || exit 1'
            ]" \
            --output text \
            --query "Command.CommandId")

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Notify Slack on success
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 Production Deployed Successfully - Tag: ${{ github.event.inputs.image_tag }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔥 PRODUCTION DEPLOY FAILED - Tag: ${{ github.event.inputs.image_tag }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
